services:
  - type: web
    name: novalang-demo
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: OPENAI_MODEL
        value: openrouter/auto
      - key: OPENAI_RESPONSE_FORMAT
        value: none
      - key: OPENAI_TIMEOUT_SEC
        value: 60
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_HTTP_REFERER
        sync: false
      - key: OPENAI_X_TITLE
        value: NOVALANG School Demo
